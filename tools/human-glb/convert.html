<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">{ "imports": { "three": "/three/build/three.module.js" } }</script>
</head>
<body>
<pre id="log">working…</pre>
<script type="module">
import * as THREE from "three";
import { FBXLoader } from "/three/examples/jsm/loaders/FBXLoader.js";
import { GLTFExporter } from "/three/examples/jsm/exporters/GLTFExporter.js";
import { mergeVertices } from "/three/examples/jsm/utils/BufferGeometryUtils.js";

const mode = new URLSearchParams(location.search).get("mode") || "report";
const TEX = ["Std_Skin_Body", "Std_Skin_Head", "Std_Skin_Arm", "Std_Skin_Leg", "Std_Nails", "Boxers", "Ga_Eye", "Ga_Teeth"];
const KEEP = ["CC_Base_Body", "Boxers", "CC_Game_Eye", "CC_Game_Teeth"];
const requested = [];
const BLANK = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

const post = (name, body) => fetch("/save?name=" + name, { method: "POST", body });
const log = (m) => (document.getElementById("log").textContent += "\n" + m);

const manager = new THREE.LoadingManager();
manager.setURLModifier((url) => {
  if (!/\.(bmp|png|jpg|tga|dds)$/i.test(url)) return url;
  const base = decodeURIComponent(url).split(/[\\/]/).pop().replace(/\.[a-z]+$/i, "");
  requested.push(base);
  const m = base.match(/^(.*)_(Diffuse|Normal)$/);
  if (m && TEX.includes(m[1])) return `/tex/${base}.jpg`;
  return BLANK;
});

try {
  const fbx = await new FBXLoader(manager).loadAsync("/src/3ds_max.Fbx");
  await new Promise((r) => setTimeout(r, 1500)); // let textures finish

  const report = { meshes: [], bones: 0, anims: fbx.animations.map((a) => [a.name, a.duration, a.tracks.length]), requested };
  fbx.traverse((o) => {
    if (o.isBone) report.bones++;
    if (o.isMesh) {
      const g = o.geometry;
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      report.meshes.push({
        name: o.name, skinned: !!o.isSkinnedMesh, verts: g.attributes.position.count,
        tris: (g.index ? g.index.count : g.attributes.position.count) / 3,
        morphs: Object.keys(g.morphAttributes).length ? g.morphAttributes.position?.length : 0,
        groups: g.groups.map((x) => [x.materialIndex, x.count / 3]),
        mats: mats.map((m) => [m.name, m.type, !!m.map, !!m.normalMap, m.transparent, m.opacity]),
      });
    }
  });
  const box = new THREE.Box3().setFromObject(fbx);
  report.box = [box.min.toArray(), box.max.toArray()];

  if (mode === "report") {
    await post("report.json", JSON.stringify(report, null, 1));
    log("report saved");
  } else {
    // drop everything we don't show: light rigs, shadow catcher, eyelashes, tongue…
    const drop = [];
    fbx.traverse((o) => { if (o.isMesh && !KEEP.includes(o.name)) drop.push(o); });
    drop.forEach((o) => o.parent.remove(o));

    fbx.traverse((o) => {
      if (!o.isMesh) return;
      const g = o.geometry;
      // no facial morphs on a website: they are most of the file
      g.morphAttributes = {};
      g.morphTargetsRelative = false;
      delete o.morphTargetInfluences;
      delete o.morphTargetDictionary;
      for (const k of Object.keys(g.attributes)) if (!["position", "normal", "uv", "skinIndex", "skinWeight"].includes(k)) g.deleteAttribute(k);

      const old = Array.isArray(o.material) ? o.material : [o.material];
      // remove triangles of eyelash / occlusion groups (they need opacity maps)
      const hide = new Set(old.map((m, i) => (/Eyelash|Occlusion|Tearline/i.test(m.name) ? i : -1)).filter((i) => i >= 0));
      if (hide.size && !g.index) g.setIndex([...Array(g.attributes.position.count).keys()]);
      if (hide.size && g.index && g.groups.length) {
        const src = g.index.array, idx = [], groups = [];
        for (const gr of g.groups) {
          if (hide.has(gr.materialIndex)) continue;
          groups.push({ start: idx.length, count: gr.count, materialIndex: gr.materialIndex });
          for (let i = gr.start; i < gr.start + gr.count; i++) idx.push(src[i]);
        }
        g.setIndex(idx);
        g.clearGroups();
        groups.forEach((x) => g.addGroup(x.start, x.count, x.materialIndex));
      }

      // share vertices between triangles: the FBX stores three per triangle
      o.geometry = mergeVertices(o.geometry);
      o.geometry.computeBoundingSphere();

      const mats = old.map((m) => {
        const s = new THREE.MeshStandardMaterial({
          name: m.name,
          color: m.map ? 0xffffff : (m.color || new THREE.Color(0xdddddd)),
          map: m.map && m.map.image && m.map.image.width > 1 ? m.map : null,
          normalMap: m.normalMap && m.normalMap.image && m.normalMap.image.width > 1 ? m.normalMap : null,
          roughness: /Eye|Teeth|Nails/.test(m.name) ? 0.25 : 0.62,
          metalness: 0,
        });
        [s.map, s.normalMap].forEach((t) => t && (t.userData.mimeType = "image/jpeg"));
        return s;
      });
      o.material = mats.length === 1 ? mats[0] : mats;
    });

    const glb = await new GLTFExporter().parseAsync(fbx, { binary: true, animations: [], onlyVisible: true });
    await post("human.glb", glb);
    log("glb saved " + glb.byteLength);
  }
} catch (e) {
  await post("error.txt", String(e && e.stack || e));
  log("error " + e);
}
</script>
</body>
</html>
